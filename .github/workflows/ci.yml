name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/samvad_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      ADMIN_API_KEY: "ci_pipeline_dummy_admin_api_key_samvad_2026"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Format Check
        run: pnpm format:check

      - name: Run Linters
        run: pnpm lint

      - name: Strict Typecheck
        run: pnpm typecheck

      - name: Run Test Suite
        run: pnpm test

      - name: Build Standalone Production Artifacts
        run: pnpm build
