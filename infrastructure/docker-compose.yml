services:
  # ----------------- Database: PostgreSQL 16 -----------------
  postgres:
    image: postgres:16-alpine
    container_name: samvad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: samvad_user
      POSTGRES_PASSWORD: samvad_secret_password
      POSTGRES_DB: samvad_perception
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samvad_user -d samvad_perception"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - samvad_network

  # ----------------- Cache & Rate Limiting: Redis 7 -----------------
  redis:
    image: redis:7-alpine
    container_name: samvad_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - samvad_network

  # ----------------- Enterprise Web Application -----------------
  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: samvad_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://samvad_user:samvad_secret_password@postgres:5432/samvad_perception?schema=public"
      REDIS_URL: "redis://redis:6379"
      ADMIN_API_KEY: "super_secure_enterprise_advisory_secret_key_samvad_2026"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_NAME: "SAMVAD Perception Advisory"
    ports:
      - "3000:3000"
    networks:
      - samvad_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  samvad_network:
    driver: bridge
