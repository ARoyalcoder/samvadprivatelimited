services:
  # ----------------- PostgreSQL Database -----------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-samvad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samvad_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-samvad_perception}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samvad_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - samvad_internal

  # ----------------- PgBouncer Connection Pooler (Supports 1000+ Concurrency) -----------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.22.0
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: ${POSTGRES_USER:-samvad_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-samvad_secret_password}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-samvad_perception}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 10
      SERVER_ROUND_ROBIN: 1
    ports:
      - "6432:6432"
    networks:
      - samvad_internal

  # ----------------- Redis Cache & Rate Limit -----------------
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1024mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - samvad_internal

  # ----------------- Web Application (Replicas for Horizontal Scaling) -----------------
  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    restart: always
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-samvad_user}:${POSTGRES_PASSWORD:-samvad_secret_password}@pgbouncer:6432/${POSTGRES_DB:-samvad_perception}?schema=public"
      REDIS_URL: "redis://redis:6379"
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://samvadadvisory.com}
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.5"
          memory: 2048M
    networks:
      - samvad_internal

  # ----------------- High-Performance Edge Proxy (Nginx) -----------------
  proxy:
    image: nginx:1.25-alpine
    restart: always
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - samvad_internal

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  samvad_internal:
    driver: bridge
